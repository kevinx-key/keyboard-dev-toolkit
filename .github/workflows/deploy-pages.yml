name: Deploy web to Cloudflare Pages

# 推送到 main 自动构建（静态导出 → out/）并部署到 Cloudflare Pages 项目 keyboard-editor。
# 需在仓库 Settings → Secrets and variables → Actions 配置：
#   CLOUDFLARE_API_TOKEN  （Cloudflare 账号 API Token）
#   CLOUDFLARE_ACCOUNT_ID （b113cbce78dd34d1a4f3dadbb4af7e09）

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static export → out/)
        run: npm run build
        env:
          NEXT_PUBLIC_GEOMETRY_API_BASE: https://starthock.com

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy out --project-name=keyboard-editor --branch main --commit-dirty=true
