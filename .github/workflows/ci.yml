name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        # TODO: 仓库存在存量 lint 债务（~600 项），专项清理完成后移除此开关
        continue-on-error: true

      - name: Type check
        run: npm run typecheck

      - name: Build (static export)
        run: npm run build

      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: next-export
          path: out/
          retention-days: 3
