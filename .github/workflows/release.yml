name: Release (Mac/Linux)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ── Build & bundle Tauri desktop app ──
  tauri-build:
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            arch: arm64

          - os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
            arch: x64

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundle: appimage
            arch: x64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Only cache the release build for the current target
          # Each platform's cache is ~200-400MB; with 4 platforms that
          # easily exceeds GitHub Free's 500 MB Actions storage limit.
          # By only keeping the current target, we reduce overhead.
          key: ${{ matrix.target }}
          cache-all-crates: false
          cache-targets: true
          cache-on-failure: false

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            javascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libfuse2

      - name: Install npm dependencies
        run: npm ci

      - name: Verify OCCT prebuilt cache (self-heal)
        shell: bash
        run: |
          TGT=$(echo "${{ matrix.target }}" | tr '-' '_')
          DIR="src-tauri/target/occt-8_0_0_rev3-$TGT"
          if [ -f "$DIR/include/opencascade/TopoDS_Shape.hxx" ] || [ -f "$DIR/inc/TopoDS_Shape.hxx" ] || [ -f "$DIR/include/TopoDS_Shape.hxx" ]; then
            echo "OCCT cache OK: $DIR"
          else
            echo "OCCT cache incomplete at $DIR — re-downloading"
            rm -rf "$DIR"
            URL="https://github.com/lzpel/cadrum/releases/download/occt-8_0_0_rev3/occt-8_0_0_rev3-$TGT.tar.gz"
            curl -L --fail --retry 3 -o occt.tar.gz "$URL"
            tar -xzf occt.tar.gz -C src-tauri/target
            rm -f occt.tar.gz
            find "$DIR" -name "TopoDS_Shape.hxx" | head -5
          fi

      - name: Build Tauri (${{ matrix.target }})
        # beforeBuildCommand in tauri.conf.json runs npm run build automatically
        # 设置签名密钥环境变量后，tauri CLI 会自动为安装包生成 .sig 签名文件
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-key-pcb-tool-${{ matrix.target }}-${{ matrix.bundle }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*
            !src-tauri/target/${{ matrix.target }}/release/bundle/**/.wix*
          retention-days: 1

  # ── Create GitHub Release ──
  create-release:
    needs: tauri-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: custom-key-pcb-tool-*
          merge-multiple: false

      - name: Collect installer files only
        shell: bash
        run: |
          mkdir -p installers/
          # Only copy the actual installer files — skip AppImage exploded contents
          # *.sig 为 Tauri updater 签名文件，必须与安装包一起上传
          find artifacts/ -type f \( -name "*.dmg" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" -o -name "*.sig" \) -exec cp {} installers/ \;
          echo "=== Installer files ==="
          ls -lh installers/

      - name: Generate updater manifest (latest.json)
        shell: bash
        run: node scripts/generate-latest-json.mjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Keyboard Dev Toolkit ${{ github.ref_name }}
          body: |
            ## Keyboard Dev Toolkit ${{ github.ref_name }}

            ### 📦 Downloads

            | Platform | File |
            |----------|------|
            | 🪟 Windows x64 | `.exe` (NSIS setup) / `.msi` |
            | 🍎 macOS Intel | `.dmg` (x86_64) |
            | 🍎 macOS Apple Silicon | `.dmg` (arm64) |
            | 🐧 Linux x64 | `.AppImage` |

            > ⚠️ **无代码签名说明**：本项目为开源社区项目，安装包未经数字签名。
            >
            > - **Windows**：SmartScreen 可能提示"未知发布者"，点"更多信息 → 仍要运行"
            > - **macOS**：打开时提示"无法验证开发者"，请右键 → 打开，或用 `xattr -dr com.apple.quarantine "/Applications/Keyboard Dev Toolkit.app"` 解除隔离
            > - **Linux**：AppImage 可直接运行，无需额外操作
          draft: true
          files: |
            installers/**/*
            latest.json
