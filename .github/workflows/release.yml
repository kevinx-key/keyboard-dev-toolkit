name: Release (Mac/Linux)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ── Build & bundle Tauri desktop app ──
  tauri-build:
    timeout-minutes: 60

    # SignPath 签名凭据（开源项目免费，申请与配置见 docs/signpath-签名指南.md）
    # 未配置 Secrets 时值为空 → Windows 签名步骤自动跳过，仍按未签名包发布，不会报错
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            bundles: dmg,app
            arch: aarch64

          - os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
            bundles: dmg,app
            arch: x64

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundle: appimage
            bundles: appimage
            arch: x64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            bundles: nsis
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Only cache the release build for the current target
          # Each platform's cache is ~200-400MB; with 4 platforms that
          # easily exceeds GitHub Free's 500 MB Actions storage limit.
          # By only keeping the current target, we reduce overhead.
          key: ${{ matrix.target }}
          cache-all-crates: false
          cache-targets: true
          cache-on-failure: false

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            javascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libfuse2

      - name: Install npm dependencies
        run: npm ci

      - name: Verify OCCT prebuilt cache (self-heal)
        shell: bash
        run: |
          TGT=$(echo "${{ matrix.target }}" | tr '-' '_')
          DIR="src-tauri/target/occt-8_0_0_rev3-$TGT"
          if [ -f "$DIR/include/opencascade/TopoDS_Shape.hxx" ] || [ -f "$DIR/inc/TopoDS_Shape.hxx" ] || [ -f "$DIR/include/TopoDS_Shape.hxx" ]; then
            echo "OCCT cache OK: $DIR"
          else
            echo "OCCT cache incomplete at $DIR — re-downloading"
            rm -rf "$DIR"
            mkdir -p src-tauri/target
            URL="https://github.com/lzpel/cadrum/releases/download/occt-8_0_0_rev3/occt-8_0_0_rev3-$TGT.tar.gz"
            curl -L --fail --retry 3 -o occt.tar.gz "$URL"
            tar -xzf occt.tar.gz -C src-tauri/target
            rm -f occt.tar.gz
            find "$DIR" -name "TopoDS_Shape.hxx" | head -5
          fi

      - name: Build Tauri (${{ matrix.target }})
        # beforeBuildCommand in tauri.conf.json runs npm run build automatically
        # 设置签名密钥环境变量后，tauri CLI 会自动为安装包生成 .sig 签名文件
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # ── macOS updater 产物重命名（.app.tar.gz 原名不含架构，x64/arm64 会同名冲突）──
      - name: Rename macOS updater artifacts
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          DIR="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          if [ ! -d "$DIR" ]; then echo "no macos bundle dir at $DIR"; exit 1; fi
          cd "$DIR"
          for f in *.app.tar.gz; do
            [ -e "$f" ] || { echo "no .app.tar.gz found"; exit 1; }
            mv "$f" "Keyboard.Dev.Toolkit_${V}_${{ matrix.arch }}.app.tar.gz"
          done
          for f in *.app.tar.gz.sig; do
            [ -e "$f" ] || continue
            mv "$f" "Keyboard.Dev.Toolkit_${V}_${{ matrix.arch }}.app.tar.gz.sig"
          done
          ls -la

      # ── Windows 绿色版（portable）：裸 exe + updater 签名，随 release 一起发布 ──
      - name: Prepare portable (green) Windows build
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          $src = "src-tauri/target/${{ matrix.target }}/release/custom-key-pcb-tool.exe"
          if (-not (Test-Path $src)) { throw "portable source exe not found: $src" }
          $destDir = "src-tauri/target/${{ matrix.target }}/release/bundle/portable"
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          $dest = Join-Path $destDir "Keyboard.Dev.Toolkit_${v}_x64-portable.exe"
          Copy-Item $src $dest -Force
          npx tauri signer sign $dest
          Get-ChildItem $destDir | Select-Object Name, Length

      # ── Windows Authenticode 签名（SignPath Foundation，开源项目免费）──────────
      # 流程：上传未签名安装包 → SignPath 云端签名 → 替换本地文件 → 重签 Tauri 更新签名(.sig)
      # 未配置 SIGNPATH_API_TOKEN 时以下三步全部跳过（保持未签名发布）
      - name: Upload unsigned Windows installer
        if: matrix.os == 'windows-latest' && env.SIGNPATH_API_TOKEN != ''
        id: upload-unsigned-windows
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-installer
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign Windows installer (SignPath)
        if: matrix.os == 'windows-latest' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: keyboard-dev-toolkit
          signing-policy-slug: release-signing
          artifact-configuration-slug: nsis-installer
          github-artifact-id: ${{ steps.upload-unsigned-windows.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-windows

      - name: Replace installer with signed version
        if: matrix.os == 'windows-latest' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $signed = Get-ChildItem "signed-windows/*.exe" | Select-Object -First 1
          if (-not $signed) { throw "SignPath 未返回签名后的安装包" }
          $target = Join-Path "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" $signed.Name
          Copy-Item $signed.FullName $target -Force
          # Authenticode 签名改变了安装包字节 → 原 Tauri 更新签名(.sig)已失效，必须重新生成
          Remove-Item "$target.sig" -ErrorAction SilentlyContinue
          npx tauri signer sign "$target"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-key-pcb-tool-${{ matrix.target }}-${{ matrix.bundle }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*
            !src-tauri/target/${{ matrix.target }}/release/bundle/**/.wix*
          retention-days: 1

  # ── Create GitHub Release ──
  create-release:
    needs: tauri-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: custom-key-pcb-tool-*
          merge-multiple: false

      - name: Collect installer files only
        shell: bash
        run: |
          mkdir -p installers/
          # Only copy the actual installer files — skip AppImage exploded contents
          # *.sig 为 Tauri updater 签名文件，必须与安装包一起上传
          # *.app.tar.gz 为 macOS updater 产物（dmg 本身不参与自动更新）
          find artifacts/ -type f \( -name "*.dmg" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" -o -name "*.app.tar.gz" -o -name "*.sig" \) -exec cp {} installers/ \;
          # GitHub Release 上传时会把资产名中的空格替换为点 → 本地先替换，保证 latest.json 里的 URL 与实际资产名一致
          cd installers
          for f in *; do
            nf="${f// /.}"
            if [ "$f" != "$nf" ]; then mv "$f" "$nf"; fi
          done
          cd ..
          echo "=== Installer files ==="
          ls -lh installers/

      - name: Generate updater manifest (latest.json)
        shell: bash
        run: |
          if node scripts/generate-latest-json.mjs; then
            echo "latest.json generated"
          else
            echo "::warning::No signed platforms — writing empty latest.json (updater inactive for this release)"
            echo '{}' > latest.json
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Keyboard Dev Toolkit ${{ github.ref_name }}
          body: |
            ## Keyboard Dev Toolkit ${{ github.ref_name }}

            ### 📦 Downloads

            | Platform | File |
            |----------|------|
            | 🪟 Windows x64 | `.exe` (NSIS setup) / `.msi` |
            | 🍎 macOS Intel | `.dmg` (x86_64) |
            | 🍎 macOS Apple Silicon | `.dmg` (arm64) |
            | 🐧 Linux x64 | `.AppImage` |

            > ⚠️ **代码签名说明**：本项目为开源社区项目；Windows 安装包已接入 SignPath Foundation 开源免费签名（仓库配置签名密钥后生效，未配置时仍为未签名包）。
            >
            > **🍎 macOS 一键安装（推荐）**：`curl -fsSL https://raw.githubusercontent.com/kevinx-key/keyboard-dev-toolkit/main/scripts/install-macos.sh | bash`
            >
            > - **Windows**：若仍提示"未知发布者"（未启用签名 / 新证书信誉不足），点"更多信息 → 仍要运行"
            > - **macOS**：提示"无法验证开发者"时，macOS 14 及以下右键 → 打开；macOS 15 及以上走 系统设置 → 隐私与安全性 →「仍然打开」；或 `xattr -dr com.apple.quarantine "/Applications/Keyboard Dev Toolkit.app"`
            > - **Linux**：AppImage 可直接运行，无需额外操作
          draft: true
          files: |
            installers/**/*
            latest.json
