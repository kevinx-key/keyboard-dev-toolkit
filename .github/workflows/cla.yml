#
# CLA Assistant — require contributors to sign CLA.md before merging.
# Docs: https://github.com/contributor-assistant/github-action
#
# Signatures are stored in THIS repository on the `cla-signatures` branch
# (path: signatures/version1/cla.json), so no cross-repo PAT is required.
# If that branch is protected against the built-in GITHUB_TOKEN, add a
# repository secret named PERSONAL_ACCESS_TOKEN (repo scope) and set it below.
#
# NOTE: GitHub Actions only runs on GitHub. If the project is also mirrored to
# Gitee, the CLA must be enforced there separately (manual review or Gitee Go).
#
name: 'CLA Assistant'

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: 'CLA Assistant'
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uncomment the next line only if the signatures branch is protected:
          # PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-document: 'https://github.com/kevinx-key/keyboard-dev-toolkit/blob/main/CLA.md'
          # Same-repo signature storage (no remote-organization/repository-name):
          branch: 'cla-signatures'
          path-to-signatures: 'signatures/version1/cla.json'
          # Maintainer logins skip signing (kevinx-key = repo org; kevinxu / 709208969 = maintainer accounts):
          allowlist: 'kevinx-key,kevinxu,709208969,dependabot[bot],*[bot]'
          custom-notsigned-prcomment: >
            Thank you for your contribution! Before we can merge this pull
            request, we need you to sign our Contributor License Agreement (CLA).
            Please read CLA.md and post the following comment to sign:
            **I have read the CLA Document and I hereby sign the CLA**
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA ✅'
